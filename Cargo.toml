[workspace]
resolver = "2"
members = [
    "crates/runt-mesh",
    "crates/runt-core",
    "crates/runt-audio",
    "crates/runt-audio-worklet",
    "crates/runt-app",
    "demo/*",
    # Offline machinery. `font-bake` turns a .ttf into the `FontAsset` a game
    # `include_bytes!`s. A workspace *member* so it shares the lock file and the
    # engine's exact `runt-core`, and deliberately **not** a *default* member —
    # `cargo build` and `cargo test` at the root are about the player, and a
    # converter only runs by hand when its input changes
    # (`cargo run -p font-bake -- --help`). The same convention
    # 3dimenshift-runt's root manifest documents for its `tools/*`.
    #
    # This is also what keeps `ab_glyph` out of every shipped wasm module: it is
    # a dependency of this binary and of nothing else in the tree.
    "tools/font-bake",
]
# `cargo run` / `cargo build` from the root act on the player host.
default-members = ["crates/runt-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
runt-mesh = { path = "crates/runt-mesh" }
runt-core = { path = "crates/runt-core" }
runt-audio = { path = "crates/runt-audio" }

# DESIGN §8. `default-features = false` + `std` is what the spike measured; the
# extra features (fft/convolve) are reverb machinery we are explicitly not doing.
fundsp = { version = "0.23", default-features = false, features = ["std"] }
# The native audio device. 0.18, **not** the 0.15 every tutorial documents —
# see `spikes/audio/FINDINGS.md` for the API deltas.
cpal = "0.18"

wgpu = "30"
winit = "0.30"
# À la carte: the ECS only. No bevy umbrella, no bevy_reflect yet (DESIGN §3 —
# reflection lands with the editor). `multi_threaded` stays off so schedules run
# on the single-threaded executor everywhere, which is what determinism wants.
bevy_ecs = { version = "0.19", default-features = false, features = ["std"] }
glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
web-time = "1"
log = "0.4"
pollster = "1"
# Content pipeline (DESIGN §6). `serde` is the stable param interface; `ron` is
# the hand-editable scene format; `postcard` is the compact byte form both the
# param hash and the on-disk mesh cache are built on.
serde = { version = "1", features = ["derive"] }
ron = "0.12"
postcard = { version = "1", default-features = false, features = ["use-std"] }

# Every test, example, and bench target links the whole workspace, and by
# default (`split-debuginfo = "packed"` on Linux) each one gets its own copy of
# every dependency's DWARF baked into the executable. With enough targets that
# is tens of gigabytes of byte-identical debuginfo. "unpacked" splits the DWARF
# out into `deps/*.dwo` and has the binaries reference it instead, so one copy
# is shared by every target that links that crate. Measured on this workspace:
# the linked artifacts drop ~60% (runt_ball 249M -> 93M, render 222M -> 73M).
#
# The tradeoff: `target/debug/deps` becomes load-bearing for debugging — a
# binary copied out of the tree, or whose `.dwo` files are gone, has no symbols
# — which only matters for a build tree you were going to rebuild anyway.
[profile.dev]
split-debuginfo = "unpacked"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# The AudioWorklet module (`crates/runt-audio-worklet`) is downloaded before the
# first sound and runs on the audio render thread, so it wants the opposite
# trade from the rest of the wasm build: speed over size, and no unwinding
# machinery at all (a panic in a worklet is unrecoverable regardless — the
# processor is dead either way).
#
# It is a *profile* rather than settings on `[profile.release]` because
# `panic = "abort"` there would break `cargo test --release` workspace-wide.
[profile.wasm-worklet]
inherits = "release"
opt-level = 3
panic = "abort"
strip = true
