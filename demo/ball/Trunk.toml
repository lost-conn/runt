# Trunk config for the demo game. Run `trunk build --release` (or `trunk serve`)
# from this directory; the root `Trunk.toml` still builds the engine demo.
#
# Unlike the workspace root, this directory *is* a package, so trunk finds a root
# crate without help — the file is here for `dist` and to keep the two builds
# from writing over each other.
[build]
target = "index.html"
dist = "dist"

# The AudioWorklet's wasm module (DESIGN §8) is a *second* wasm artifact trunk
# knows nothing about: a raw `cdylib` with no wasm-bindgen glue, which trunk has
# no rule for. So it is built here, before trunk's own build, and placed in
# `dist/` by the `copy-file` links in index.html.
#
# This is the recipe verified in `spikes/audio/FINDINGS.md` ("Trunk integration").
# Two gotchas it records are load-bearing: `copy-file` hrefs resolve relative to
# index.html, and copied files keep **unhashed** names — which is what lets
# `runt-audio.js` name `runt_audio_worklet.wasm` as a plain relative URL.
[[hooks]]
stage = "pre_build"
command = "bash"
command_arguments = ["build-worklet.sh"]
