name: Deploy demo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Pin the trunk version we develop against (see Trunk.toml notes).
      - name: Install trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xzf - -C /usr/local/bin trunk
          trunk --version

      # Game at the site root; engine demo scene under /engine/.
      # --public-url must match the project-pages prefix (/runt/).
      - name: Build game (site root)
        working-directory: demo/ball
        run: trunk build --release --public-url /runt/ --dist ../../_site

      - name: Build engine demo (/engine/)
        run: trunk build --release --public-url /runt/engine/ --dist _site/engine

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
