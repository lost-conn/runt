[package]
name = "runt-audio"
version.workspace = true
edition.workspace = true
description = "runt audio (DESIGN §8): patch params as content, the wire codec both hosts share, and — behind `dsp` — the fundsp voice pool."

[features]
default = []
# The synthesis half: fundsp, the two patches, the voice pool.
#
# Off by default so the *game* wasm module never links it. A game only needs to
# describe a [`PatchBank`] and encode events; the synth lives either in the
# native host (`runt-app`, which turns this on) or in the worklet cdylib
# (`runt-audio-worklet`, which turns this on). That split is what keeps fundsp's
# `glam 0.28` — a semver major behind the workspace's 0.33 — out of every build
# that draws a triangle.
dsp = ["dep:fundsp"]
# Editor-facing reflection, mirroring `runt-core`'s feature of the same name
# (DESIGN §3, §10): param panels are generated by walking `Reflect`, and the
# player must never link `bevy_reflect`. §8's phase-3 item 5 (audition panels) is
# what turns this on.
reflect = ["dep:bevy_reflect"]

[dependencies]
serde.workspace = true
# The bank crosses the worklet boundary as bytes. postcard because it is already
# the workspace's compact byte form (DESIGN §6) and needs no allocator features
# a `cdylib` cannot supply.
postcard.workspace = true
fundsp = { workspace = true, optional = true }
# Same 0.19 train and the same `default-features = false` reasoning as
# `runt-core`'s: its `glam` feature targets a glam we are not on.
bevy_reflect = { version = "0.19", optional = true, default-features = false, features = [
    "std",
] }

[dev-dependencies]
# Only the `audition` example (the manual listen step) needs a device; tests are
# all offline. Not a real dependency of anything runt ships from this crate.
cpal.workspace = true

[[example]]
name = "audition"
required-features = ["dsp"]
