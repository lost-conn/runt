[package]
name = "runt-app"
version.workspace = true
edition.workspace = true
description = "runt player host: winit event loop, surface + present, web canvas glue."

[lib]
name = "runt_app"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "runt-native"
path = "src/main.rs"

[features]
# The `#[wasm_bindgen(start)]` for the engine demo. On by default so building
# this crate as the wasm target Just Works; a game crate that is *itself* the
# wasm target turns it off, because a module may only have one start function
# and wasm-bindgen collects them from dependencies too.
default = ["wasm-entry"]
wasm-entry = []

[dependencies]
runt-core.workspace = true
# **Default features only here**: the wire codec and the patch bank, no fundsp.
# The wasm build of this crate must not link a synthesizer — on web the synth is
# a *separate* module the browser fetches on first sound (DESIGN §8). The native
# target section below turns `dsp` on, because there the synth is in-process.
runt-audio.workspace = true
wgpu.workspace = true
winit.workspace = true
glam.workspace = true
web-time.workspace = true
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true
env_logger = "0.11"
runt-audio = { workspace = true, features = ["dsp"] }
cpal.workspace = true
# Gamepads, native side (DESIGN §2 — host-side event translation). The web side
# is `navigator.getGamepads()` through web-sys below; gilrs does have a wasm
# backend, but it is the same browser API behind a second abstraction and a
# second copy of the mapping database in the wasm blob.
gilrs = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The WebGL2 fallback lives with the host: it is a backend/presentation
# concern, and runt-core never touches a surface.
wgpu = { workspace = true, features = ["webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlElement",
    "Node",
    # Gamepads (see `src/gamepad.rs`): the array comes off `Navigator`, the
    # mapping check needs the enum, and the buttons are objects rather than
    # numbers because they are analog.
    "Gamepad",
    "GamepadButton",
    "GamepadMappingType",
    "Navigator",
    # `src/storage.rs`.
    "Storage",
] }
# The audio backend calls two functions on `window.runtAudio` (see
# `web/runt-audio.js`). That needs `Reflect` and `Uint8Array` and nothing else —
# no `AudioContext` bindings, because the browser plumbing is JavaScript.
js-sys = "0.3"
