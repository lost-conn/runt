[package]
name = "runt-core"
version.workspace = true
edition.workspace = true
description = "runt engine core: windowless renderer that draws into a caller-provided TextureView."

[features]
default = []
# Editor-only reflection (DESIGN §3, §10). Off by default so the wasm player
# never pays for it — `cargo tree --target wasm32-unknown-unknown -p runt-app`
# must stay free of `bevy_reflect`.
reflect = ["dep:bevy_reflect"]
# The in-game scene editor (DESIGN §10a): picking, gizmos, the op log, and the
# `EditableScene` seam a game implements over its own level format. Implies
# `reflect` because the tweak panel *is* the property editor for a selection —
# there is no version of this tool worth shipping without it — and because both
# halves of §10a's "tooling is one feature, not one crate" must be off together
# for the wasm player.
editor = ["reflect"]
# The 8 × 8 fallback typeface (`font::micro`). Off by default because a game is
# expected to bake its own face with `tools/font-bake`, and two fonts in one wasm
# module is the thing that split exists to avoid — but 816 bytes of table is what
# a game has *before* it has picked one, and it is what the baker substitutes for
# a codepoint a real typeface turns out not to contain. Pure data and code: it
# adds no dependency, and `font` itself is compiled unconditionally.
default-font = []

[dependencies]
runt-mesh = { workspace = true, features = ["serde"] }
bevy_ecs.workspace = true
wgpu.workspace = true
glam = { workspace = true, features = ["serde"] }
bytemuck.workspace = true
log.workspace = true
serde.workspace = true
ron.workspace = true
postcard.workspace = true
# Same 0.19 release train as `bevy_ecs`. Deliberately *without* its `glam`
# feature: that feature targets glam 0.32 and runt is on 0.33 — a different
# semver major, so its `Reflect` impls would not apply to our vectors anyway.
# `src/reflect.rs` supplies remote definitions for the glam types instead.
bevy_reflect = { version = "0.19", optional = true, default-features = false, features = [
    "std",
] }

[dev-dependencies]
pollster.workspace = true
# wgpu's own shader translator, pinned to the version wgpu 30 already resolves,
# so this adds a feature to a crate the tree contains rather than a crate.
# `tests/render_scale.rs` runs the WebGL2 backend's exact WGSL → GLSL-ES 3.00
# path over the blit shader: a pipeline that compiles on Vulkan and fails to
# *translate* is a shader that only breaks in a browser (DESIGN §11).
naga = { version = "30", features = ["wgsl-in", "glsl-out"] }
